‎<h2>Results</h2>
‎<p>Effects of SOD inhibitor DETC on BP.
‎Systolic and diastolic BP increased in DETC rats, and they decreased with tempol in DETC rats to the levels of control rats and tempol rats (Fig. 1, A and B). <Effects of SOD inhibitor DETC on AT1 receptor function.
‎Diuretic response to AT1 receptor blocker candesartan increased in control rats, and it further increased in DETC rats. Diuretic response decreased with tempol in DETC rats to the level of tempol rats (Fig. 2A). The levels of urine flow were similar in response to saline infusion in control rats, DETC rats, DETC rats with tempol, and tempol rats (Fig. 2A). Diethylthiocarbamate (DETC) increases systolic (A) and diastolic (B) blood pressures in Sprague-Dawley (SD) rats. Blood pressure was measured in anesthetized rats treated with and without DETC and tempol, as described in materials and methods. Bar graphs represent results as means ± SE; n = 7–8 rats. *Different from control rats. #Different from DETC rats. P < 0.05. Diethylthiocarbamate (DETC) increases diuretic and natriuretic response to candesartan in Sprague-Dawley (SD) rats. Diuresis (A) and natriuresis (B) in response to angiotensin II type 1 (AT1) receptor antagonist candesartan (details in materials and methods). C, saline infusion; D, candesartan infusion. Bar graphs represent results as means ± SE; n = 7–8 rats. *Different from control rats. #Different from DETC rats. P < 0.05. Diethylthiocarbamate (DETC) increases superoxide but not H2O2 in the renal tissues of Sprague-Dawley (SD) rats. Fluorescence levels of superoxide [dihydroethidium (DHE), A] and H2O2 (DCFHDA, B) were measured in the renal tissues of rats treated with and without DETC and tempol, as described in materials and methods. Bar graphs represent results as means ± SE; n = 7–8 rats. *Different from control rats. #Different from DETC rats. P < 0.05. Diethylthiocarbamate (DETC) increases the abundance of membranous angiotensin II type 1 (AT1) receptor (AT1R) in Sprague-Dawley (SD) rats. AT1 receptors were measured by Western blotting in the renal tissues of rats treated with and without DETC and tempol (details in materials and methods). Top: representative blots for AT1 receptor and tubulin (loading control). Bottom: bar graphs represent ratios of the densities between AT1R and tubulin. Results are means ± SE; n = 7–8 rats. *Different from control rats. #Different from DETC rats. P < 0.05, n = 7–8 rats. Diethylthiocarbamate (DETC) increases lysine acetylation but not serine phosphorylation of Sp3. Nuclear extracts from the renal cortical tissues of rats treated with and without DETC and tempol were used to determine Sp3 lysine acetylation (A), Sp3 serine phosphorylation (B), and Sp3 proteins (C) (details in materials and methods). Top: representative blots for Sp3 lysine acetylation (A), Sp3 serine phosphorylation (B), and Sp3 proteins (C). Bottom: bar graphs represent ratios of the densities of Sp3 lysine acetylation/Sp3 protein (A) and Sp3 serine phosphorylation/Sp3 protein (B). Sp3 protein loading controls (C). Results are means ± SE; n = 7–8 rats. *Different from control rats. #Different from DETC rats. P < 0.05.</p>
